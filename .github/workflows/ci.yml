name: CI - Build & Test

on:
  pull_request:
    branches:
      - main # main 브랜치로 들어오는 PR에 대해 실행

jobs:
  build: # 빌드 작업
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 코드 체크아웃

      - name: Set up JDK # JDK 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Build with Gradle # Gradle로 빌드
        run: ./gradlew clean build -x test --no-daemon

  test: # 테스트 작업
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4 # 코드 체크아웃

      - name: Grant execute permission for gradlew # gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: Generate application-secret.yml # 비밀 설정 파일 생성
        run: |
          cat > src/main/resources/application-secret.yml <<EOL
          openweather:
            api:
              key: ${{ secrets.OPENWEATHER_API_KEY }}
          EOL

      - name: Run tests # 테스트 실행
        run: ./gradlew test --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test